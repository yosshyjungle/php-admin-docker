services:
  php-app:
    container_name: run-php-app
    build: ./app
    ports:
      - "18080:80"
    volumes:
      - ./app/src:/var/www/html
    networks:
      - php-mysql-networks
    depends_on:
      - php-db

  php-db:
    image: mysql:8.0
    container_name: run-php-db
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_DATABASE: test_db
    volumes:
      - ./mysql/initdb.d:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    networks:
      - php-mysql-networks

  php-admin:
    image: phpmyadmin/phpmyadmin
    container_name: run-php-admin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=php-db
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
      - MYSQL_ROOT_PASSWORD=root
    depends_on:
      - php-db
    networks:
      - php-mysql-networks

volumes:
  mysql-data:

networks:
  php-mysql-networks: